name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # the program is shipped for Windows and macOS too (release.yml builds it there, on 3.12)
          - {os: windows-latest, python-version: "3.12"}
          - {os: macos-latest, python-version: "3.12"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      # the listening page is tested in a real browser (tests/test_audition.py); without one
      # that test cannot run, and it is the one that shows the page works for a person
      - name: Install the browser for the listening-page test
        run: python -m playwright install --with-deps chromium

      # style and types do not depend on the system: not repeated on Windows and macOS
      - name: Lint
        if: runner.os == 'Linux'
        run: flake8 src tests benchmarks

      - name: Format check
        if: runner.os == 'Linux'
        run: black --check src tests benchmarks

      - name: Type check
        if: runner.os == 'Linux'
        run: mypy

      - name: Test
        if: runner.os == 'Linux'
        run: pytest -v --cov --cov-report=term-missing --cov-fail-under=90

      # on Windows and macOS the tests alone: the coverage gate is measured on Linux, where
      # the tests that need a POSIX shell run too
      - name: Test (Windows, macOS)
        if: runner.os != 'Linux'
        run: pytest -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build and check the distribution
        run: |
          pip install build twine
          python -m build
          twine check dist/*
