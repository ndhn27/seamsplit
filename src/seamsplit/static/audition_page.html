<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SeamSplit listening kit</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f5f6f8; --card: #fff; --text: #1d2230; --muted: #5d6578; --line: #d9dde6;
  --accent: #2f6fed; --accent-text: #fff; --ok: #1a7f4b; --warn: #a15c00; --err: #b3261e;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171f; --card: #1c212c; --text: #e8ebf2; --muted: #9aa3b5; --line: #323a4b;
    --accent: #5b94ff; --accent-text: #0c1220; --ok: #5fd39a; --warn: #f0b252; --err: #ff8a80;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
main { max-width: 820px; margin: 0 auto; padding: 24px 16px 48px; }
header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 24px; }
header .spacer { flex: 1; }
.muted { color: var(--muted); }
button, a.btn { display: inline-block; font: inherit; padding: 6px 14px; border-radius: 8px; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--text); text-decoration: none; }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title"></h1>
    <span class="muted" id="source"></span>
    <span class="spacer"></span>
    <button id="lang" type="button">VI</button>
  </header>
  <div id="root"></div>
</main>
<script>/*PLAYER*/</script>
<script>
"use strict";
const KIT = /*KIT*/null;
const PAGE = {
  en: { title: "Listening kit", file: "Answers are kept in this browser; download them to keep or share them." },
  vi: { title: "Bộ nghe thử", file: "Câu trả lời được lưu trong trình duyệt này; hãy tải về để giữ hoặc chia sẻ." },
};
let lang = "en";
const storeKey = "seamsplit-kit:" + KIT.created + ":" + (KIT.source_file || "");
try { lang = localStorage.getItem("lang") || ""; } catch (e) { /* storage may be blocked */ }
if (lang !== "en" && lang !== "vi") lang = (navigator.language || "en").slice(0, 2) === "vi" ? "vi" : "en";

function t(key, vars) {
  let s = SeamAudition.TEXT[lang][key] ?? SeamAudition.TEXT.en[key] ?? PAGE[lang][key] ?? key;
  for (const k in vars || {}) s = s.replace("{" + k + "}", () => String(vars[k]));
  return s;
}

function load() {
  try { return JSON.parse(localStorage.getItem(storeKey) || "{}"); } catch (e) { return {}; }
}
const initial = load();

function render() {
  document.documentElement.lang = lang;
  document.title = PAGE[lang].title + (KIT.source_file ? " - " + KIT.source_file : "");
  document.getElementById("title").textContent = t("listenTitle").replace(/^\d+\.\s*/, "");
  document.getElementById("source").textContent = KIT.source_file || "";
  document.getElementById("lang").textContent = lang === "vi" ? "EN" : "VI";
  const player = SeamAudition.mount(document.getElementById("root"), KIT, {
    url: (file) => encodeURIComponent(file),
    t,
    initial,
    save: async (seam, choice, blind) => {
      const next = load();
      next[seam] = { choice, blind, at: new Date().toISOString() };
      try { localStorage.setItem(storeKey, JSON.stringify(next)); } catch (e) { /* not kept */ }
      return null;
    },
    download: (doc) => {
      const blob = new Blob([JSON.stringify(doc, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "choices.json";
      a.click();
      URL.revokeObjectURL(a.href);
    },
  });
  return player;
}

document.getElementById("lang").addEventListener("click", () => {
  lang = lang === "vi" ? "en" : "vi";
  try { localStorage.setItem("lang", lang); } catch (e) { /* ignore */ }
  Object.assign(initial, load());
  render();
});
render();
</script>
</body>
</html>
