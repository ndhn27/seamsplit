name: Publish to PyPI

# Builds the package and, when a tag like v1.2.3 is pushed (it must be the package version),
# publishes it to PyPI. No password or token is stored anywhere: PyPI trusts this workflow
# itself (Trusted Publishing, OpenID Connect), as set up under "Publishing" on pypi.org.
# "Run workflow" only builds and checks the files and keeps them as a downloadable artifact.
#
# Every action is pinned to a commit (the comment after the SHA is the version it is), like
# in ci.yml and release.yml. .github/dependabot.yml proposes the updates.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read # the build job; the publish job asks for more, for itself, below

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: The tag is the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME is not the package version $version" >&2
            exit 1
          fi

      - name: Build and check the distribution
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/seamsplit
    permissions:
      id-token: write # to get the short-lived token PyPI trusts this workflow with
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
